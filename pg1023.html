<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>普高圖書館</title>
<style>
  *{box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
    margin:0;padding:12px;background:#f0f2f5;color:#222;max-width:540px;margin:0 auto;
    padding-bottom: 40px;
  }
  .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
  h2{font-size:18px;margin:0 0 10px;color:#2e7d32}
  label.f{display:block;font-size:14px;font-weight:700;margin:8px 0 6px;color:#333}
  
  input[type=text],select,textarea{
    width:100%;padding:12px;font-size:16px;border:1px solid #dcdcd6;border-radius:10px;background:#fff;font-family:inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type=text]:focus,select:focus,textarea:focus{
    outline:none;border-color:#2e7d32;box-shadow:0 0 0 3px rgba(46,125,50,0.15);
  }
  textarea{height:120px;resize:vertical}
  
  .with-btn{display:flex;gap:8px}
  .with-btn input{flex:1;letter-spacing:1px}
  .scanbtn{flex:0 0 auto;width:105px;background:#2e7d32;color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
  .scanbtn:active{opacity:0.9;transform:scale(0.98)}

  .hero{margin:-4px 0 10px}.hero img{display:block;width:100%;height:auto;border-radius:10px}
  .hint{font-size:13px;margin-top:6px;min-height:18px;color:#666}
  .ok{color:#2e7d32;font-weight:bold}.bad{color:#c62828;font-weight:bold}.warn{color:#e67e22;font-weight:bold}
  .submit{width:100%;background:#2e7d32;color:#fff;border:0;border-radius:10px;padding:15px;font-size:18px;font-weight:bold;margin-top:14px;cursor:pointer;box-shadow: 0 4px 12px rgba(46,125,50,0.25)}
  .submit:active{transform:scale(0.99)}
  pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f7f7f5;padding:10px;border-radius:8px;margin:8px 0 0}

  /* 步驟卡片與進度條樣式 */
  .step-header-card{
    background: #ffffff;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,.06);
    position: sticky;
    top: 8px;
    z-index: 10;
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,0.95);
  }
  .progress-bar-bg{
    background: #e0e0e0;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar-fill{
    background: #2e7d32;
    height: 100%;
    width: 16.66%;
    transition: width 0.3s ease;
  }
  .step-badge-container{
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    padding: 0 2px;
  }
  .step-dot{
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e0e0e0;
    color: #666;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    transition: all 0.3s;
  }
  .step-dot.active{
    background: #2e7d32;
    color: #fff;
    box-shadow: 0 0 0 3px rgba(46,125,50,0.2);
  }
  .step-dot.completed{
    background: #81c784;
    color: #fff;
  }

  .step-card{
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    border: 2px solid #eef0f2;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .step-card.active-step{
    border-color: #2e7d32;
    box-shadow: 0 4px 12px rgba(46,125,50,0.08);
  }
  .step-card.done-step{
    border-color: #a5d6a7;
    background: #fbfdfb;
  }
  .step-title{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    border-bottom: 1px solid #f0f0f0;
    padding-bottom: 8px;
  }
  .step-title-text{
    font-size: 15px;
    font-weight: bold;
    color: #2e7d32;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .step-number-tag{
    background: #e8f5e9;
    color: #2e7d32;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: bold;
  }
  .step-status-icon{
    font-size: 13px;
    color: #999;
  }

  /* 掃描全螢幕層 */
  #ov{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
  #ov .top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;color:#fff}
  #ov .top b{font-size:17px}
  #ov .top button{background:#555;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
  #ov .view{position:relative;flex:1;overflow:hidden}
  #ov video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #ov .frame{position:absolute;left:7%;right:7%;top:33%;bottom:33%;border:2px solid #7CFC00;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
  #ov .frame i{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,60,60,.85)}
  #ov .frame.ocr{left:37.5%;right:37.5%;top:37%;bottom:37%}
  #ov .frame.ocr i{display:none}
  #ov .msg{padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);color:#fff;font-size:14px;text-align:center;min-height:62px}
  #ov .msg .w{color:#ffb74d}

  .step-dot{cursor:pointer}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };

/* ===== 格式規則（書標、書碼都是固定格式）===== */
function ean13Valid(s){
  if(!/^\d{13}$/.test(s)) return false;
  var sum = 0; for(var i=0;i<12;i++) sum += (+s[i]) * (i%2 ? 3 : 1);
  return ((10 - sum % 10) % 10) === +s[12];
}
var RULES = {
  label: {
    name: '書標',
    norm: function(v){ return String(v).trim().toUpperCase(); },
    // 回傳 {ok, msg}
    check: function(v){
      return /^[A-Z]\d{5}$/.test(v) ? {ok:true, msg:'書標格式正確'} : {ok:false, msg:'書標應為 1 個英文字母加 5 碼數字，例如 A00012'};
    }
  },
  isbn: {
    name: '書碼',
    norm: function(v){ return String(v).replace(/[\s-]/g, ''); },
    check: function(v){
      if(!/^\d{13}$/.test(v)) return {ok:false, msg:'書碼應為 13 碼數字'};
      if(!ean13Valid(v)) return {ok:false, msg:'檢查碼錯誤，疑似誤讀或打錯'};
      if(/^(978|979)/.test(v)) return {ok:true, msg:'圖書 ISBN，檢查碼正確'};
      if(/^977/.test(v)) return {ok:true, msg:'期刊／雜誌條碼，檢查碼正確'};
      return {ok:false, msg:'不是圖書(978/979)或期刊(977)條碼'};
    }
  }
};

/* ===== 欄位即時檢查（手動輸入也適用）===== */
function refreshHint(kind){
  var el = $(kind), h = $(kind + 'Hint'), v = RULES[kind].norm(el.value);
  if(!v){ h.innerHTML = ''; return; }
  var r = RULES[kind].check(v);
  h.innerHTML = '<span class="' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? '✓ ' : '✗ ') + r.msg + '</span>';
  if(kind === 'label' && r.ok) dupCheck(v);
}

// 書標填好（輸入或掃描）後，立刻問後端是否已登錄過；已登錄就警告（送出時後端仍會擋）
var dupTimer = 0;
function dupCheck(v){
  clearTimeout(dupTimer);
  if(typeof API_URL === 'undefined' || !API_URL || !$('acct').value || $('acct').value.length !== 6) return;
  dupTimer = setTimeout(async function(){
    try{
      var r = await api({action:'check', code:$('acct').value, label:v});
      if(RULES.label.norm($('label').value) !== v) return;
      if(r.ok && r.exists) $('labelHint').innerHTML = '<span class="bad">⚠ 書標 ' + v + ' 已登錄過（試算表第 ' + r.row + ' 列），送出會被拒絕</span>';
    }catch(e){}
  }, 400);
}
['label','isbn'].forEach(function(k){
  $(k).addEventListener('input', function(){
    if(k === 'label') this.value = this.value.toUpperCase();
    refreshHint(k);
  });
});

/* ===== 掃描 ===== */
var video = $('video'), stream = null, track = null, scanning = false, timer = 0;
var kindNow = '', nativeDet = null, mfr = null;
var cv = document.createElement('canvas'), ctx = cv.getContext('2d', {willReadFrequently:true});

async function openScan(kind){
  if(scanning) return;
  kindNow = kind;
  $('ovTitle').textContent = '掃描' + RULES[kind].name;
  $('ovMsg').textContent = '要求相機權限中…';
  $('ov').style.display = 'flex';
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
    track = stream.getVideoTracks()[0];
    try{ await track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
    video.srcObject = stream;
    await video.play();

    if('BarcodeDetector' in window){
      var sup = await BarcodeDetector.getSupportedFormats();
      var want = ['ean_13','code_128','code_39','qr_code'].filter(function(f){ return sup.indexOf(f)>-1; });
      nativeDet = new BarcodeDetector({formats:want}); mfr = null;
    } else if(window.ZXing){
      var Z = ZXing, h = new Map();
      h.set(Z.DecodeHintType.TRY_HARDER, true);
      // 書標可能是 QR / Code128 / Code39；書碼是 EAN-13
      var fm = (kind === 'isbn') ? [Z.BarcodeFormat.EAN_13] : [Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39];
      h.set(Z.DecodeHintType.POSSIBLE_FORMATS, fm);
      mfr = new Z.MultiFormatReader(); mfr.setHints(h); nativeDet = null;
    } else { throw new Error('沒有可用的掃描引擎（ZXing 未載入，請確認網路）'); }

    scanning = true;
    $('ovMsg').textContent = (kind === 'isbn') ? '把書背的條碼放進綠框，橫向對齊紅線' : '把書標（QR 或條碼）放進綠框';
    loop();
  }catch(e){
    var msg = (e && (e.name + ': ' + e.message)) || String(e);
    var tip = /NotAllowed|Permission/i.test(msg) ? '<br>請允許相機權限；若在 LINE／FB 內建瀏覽器開啟，請改用 Safari 或 Chrome。' : '';
    $('ovMsg').innerHTML = '<span class="w">啟動失敗：' + msg + '</span>' + tip;
    stopCamera();
  }
}

async function loop(){
  if(!scanning) return;
  var t = performance.now();
  try{
    if(video.readyState >= 2 && video.videoWidth){
      var raw = null;
      // 只讀綠框裡的畫面（框外的鄰書條碼、書背文字一律不讀）
      var area = frameCrop(1600);
      if(nativeDet){
        var codes = await nativeDet.detect(area);
        if(codes.length) raw = codes[0].rawValue;
      } else {
        try{
          var lum = new ZXing.HTMLCanvasElementLuminanceSource(area);
          raw = mfr.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum))).getText();
        }catch(e){}
      }
      if(raw) handleRaw(raw);
    }
  }catch(e){}
  if(scanning) timer = setTimeout(loop, Math.max(0, 60 - (performance.now() - t)));
}

function handleRaw(raw){
  var rule = RULES[kindNow];
  var v = rule.norm(raw);
  var r = rule.check(v);
  if(r.ok){
    $(kindNow).value = v;
    refreshHint(kindNow);
    if(navigator.vibrate) navigator.vibrate(80);
    closeScan();
    // 掃完書標，若書碼還是空的，自動接著掃書碼
    if(kindNow === 'label' && !$('isbn').value) { /* 預留：可改成自動連續掃描 */ }
  } else {
    // 讀到了但格式不符 → 不填入，提示後繼續掃
    $('ovMsg').innerHTML = '<span class="w">讀到「' + String(raw).slice(0,24) + '」：' + r.msg + '</span><br>請對準正確的條碼';
  }
}

function stopCamera(){
  scanning = false; clearTimeout(timer);
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); }
  stream = null; track = null; video.srcObject = null;
}
function closeScan(){
  stopCamera(); ocrMode = false; clearTimeout(ocrTimer);
  $('ovBar').style.display = 'none';
  document.querySelector('#ov .frame').className = 'frame';
  $('ov').style.display = 'none';
}

/* ===== 版權頁內容：貼上後顯示字數，不做任何截斷或改寫 ===== */
$('copyright').addEventListener('input', function(){
  var n = this.value.length;
  $('copyrightHint').innerHTML = n ? ('<span class="ok">已貼上 ' + n + ' 字</span>' + (n > 45000 ? ' <span class="bad">（接近試算表單格 5 萬字上限）</span>' : '')) : '';
});

/* ===== 草稿自動暫存：切到智慧鏡頭再回來、或頁面被系統回收，已填內容都還在 ===== */
var DRAFT_IDS = ['zone','label','isbn','cn_sp','cn_cls','cn_author','cn_copy','copyright','note'];
function saveDraft(){
  try{ var o = {}; DRAFT_IDS.forEach(function(id){ o[id] = $(id).value; }); localStorage.setItem('lib_draft', JSON.stringify(o)); }catch(e){}
}
function loadDraft(){
  try{
    var o = JSON.parse(localStorage.getItem('lib_draft') || '{}');
    DRAFT_IDS.forEach(function(id){ if(o[id] != null) $(id).value = o[id]; });
    refreshHint('label'); refreshHint('isbn'); refreshCallnoHint();
    $('copyright').dispatchEvent(new Event('input'));
  }catch(e){}
}
function clearForm(){
  if(!confirm('確定清空目前填的內容？')) return;
  DRAFT_IDS.forEach(function(id){ if(id !== 'zone') $(id).value = ''; });
  try{ localStorage.removeItem('lib_draft'); }catch(e){}
  refreshHint('label'); refreshHint('isbn'); refreshCallnoHint();
  $('copyright').dispatchEvent(new Event('input'));
  $('ocrHint').innerHTML = ''; $('ocrPreview').innerHTML = ''; $('lensHint').innerHTML = ''; $('out').style.display = 'none';
}
setInterval(saveDraft, 2000);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') saveDraft(); });
window.addEventListener('pagehide', saveDraft);

/* ===== 嘗試開啟 Google 智慧鏡頭（實驗：是否成功取決於手機與 App 版本）===== */
function openLens(){
  var hint = $('lensHint'), ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua), android = /Android/.test(ua), left = false;
  if(!ios && !android){ hint.innerHTML = '<span class="warn">這個功能只在手機上有用</span>'; return; }
  function onHide(){ if(document.visibilityState === 'hidden') left = true; }
  document.addEventListener('visibilitychange', onHide);
  saveDraft();
  hint.innerHTML = '<span class="warn">嘗試開啟 Google 智慧鏡頭…</span>';
  if(ios) location.href = 'googleapp://lens';
  else location.href = 'intent://lens#Intent;scheme=googleapp;package=com.google.android.googlequicksearchbox;end';
  setTimeout(function(){
    document.removeEventListener('visibilitychange', onHide);
    hint.innerHTML = left
      ? '已跳轉。複製文字後請切回此頁貼上（表單內容已自動暫存）。'
      : '<span class="bad">沒有自動跳轉</span>，請手動開啟 Google App 的智慧鏡頭（<a href="https://lens.google.com/" target="_blank" rel="noopener">或開網頁版</a>），複製文字後回來貼上。';
  }, 2000);
}

loadDraft();

/* ===== 後端設定 ===== */
// 貼上 GAS「網路應用程式」的 /exec 網址
var API_URL = 'https://script.google.com/macros/s/AKfycbxZB_m2-mtV6Le4fSjKuCiqPVNuGejtPR8iDSHE_2m8OiZ8FeqfaiHw0Q9hvariAinuow/exec';
var userName = '';

function api(payload){
  return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
    .then(function(r){ return r.json(); });
}
async function doLogin(auto){
  var code = $('acct').value, h = $('loginMsg'), btn = $('loginBtn');
  if(code.length !== 6){ h.innerHTML = '<span class="bad">請輸入 6 碼 PIN</span>'; return; }
  if(!API_URL){ h.innerHTML = '<span class="bad">系統尚未連接後端（API_URL 未設定），無法登入</span>'; return; }
  btn.disabled = true; btn.textContent = '登入中…'; h.innerHTML = '';
  try{
    var r = await api({action:'login', code:code});
    if(r.ok){ userName = r.name; try{ localStorage.setItem('lib_code', code); }catch(e){} enterWork(r.count); }
    else{
      h.innerHTML = '<span class="bad">✗ ' + escHtml(r.error || 'PIN 不正確') + '</span>';
      if(auto){ try{ localStorage.removeItem('lib_code'); }catch(e){} $('acct').value = ''; }
    }
  }catch(e){ h.innerHTML = '<span class="bad">連線失敗，請檢查網路後再按登入</span>'; }
  btn.disabled = false; btn.textContent = '登入';
}
function enterWork(count){
  $('loginView').style.display = 'none'; $('workView').style.display = 'block';
  showUser(count); window.scrollTo(0, 0);
}
function logout(){
  userName = '';
  try{ localStorage.removeItem('lib_code'); }catch(e){}
  $('acct').value = ''; $('loginMsg').innerHTML = ''; $('out').style.display = 'none';
  $('workView').style.display = 'none'; $('loginView').style.display = 'block';
}
function showUser(n){
  $('userBar').innerHTML = '<span class="ok">👤 ' + escHtml(userName) + '</span>　已輸入 <b>' + (n == null ? '—' : n) + '</b> 筆';
}
var STRICT = false;   // 測試中：false＝全部欄位可空白、格式不符也能送出；正式上線改 true
var submitting = false;
async function submitRecord(){
  if(submitting) return;
  var lab = RULES.label.norm($('label').value), isbn = RULES.isbn.norm($('isbn').value);
  var errs = [], out = $('out');
  if($('acct').value.length !== 6) errs.push('請先輸入 6 碼 PIN');
  else if(API_URL && !userName) errs.push('PIN 未通過驗證');
  if(STRICT){
    if(!lab) errs.push('書標必填'); else if(!RULES.label.check(lab).ok) errs.push('書標格式不符');
    if(isbn && !RULES.isbn.check(isbn).ok) errs.push('書碼格式不符（無書碼請留空）');
  }
  out.style.display = 'block';
  if(errs.length){ out.textContent = '❌ ' + errs.join('；'); return; }
  var rec = {action:'add', code:$('acct').value, zone:$('zone').value, label:lab, isbn:isbn,
    sp:$('cn_sp').value.trim(), cls:$('cn_cls').value.trim(), author:$('cn_author').value.trim(), copy:$('cn_copy').value.trim(),
    copyright:$('copyright').value, note:$('note').value};
  if(!API_URL){ out.textContent = JSON.stringify(rec, null, 2); return; }
  submitting = true; var btn = $('submitBtn'); btn.disabled = true; btn.textContent = '送出中…'; out.textContent = '寫入中…';
  try{
    var r = await api(rec);
    if(r.ok){
      out.textContent = '✅ 已登錄 ' + (lab || '（無書標）') + '（第 ' + r.row + ' 列）'; showUser(r.count);
      DRAFT_IDS.forEach(function(id){ if(id !== 'zone') $(id).value = ''; });
      try{ localStorage.removeItem('lib_draft'); }catch(e){}
      refreshHint('label'); refreshHint('isbn'); refreshCallnoHint();
      $('copyright').dispatchEvent(new Event('input'));
      $('ocrHint').innerHTML = ''; $('ocrPreview').innerHTML = ''; $('lensHint').innerHTML = '';
      window.scrollTo(0, 0);
    }else out.textContent = '❌ ' + (r.error || '寫入失敗');
  }catch(e){ out.textContent = '❌ 連線失敗，資料還在表單裡，請確認網路後再按送出'; }
  submitting = false; btn.disabled = false; btn.textContent = '送出';
}

// PIN：登入成功後才記在本機，下次開啟自動登入
try{ $('acct').value = localStorage.getItem('lib_code') || ''; }catch(e){}
$('acct').addEventListener('input', function(){ this.value = this.value.replace(/\D/g, ''); $('loginMsg').innerHTML = ''; });
$('acct').addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
if($('acct').value.length === 6) doLogin(true);


/* ===== 步驟進度：有填內容的步驟標示完成，第一個未完成的步驟高亮 ===== */
function stepDone(n){
  if(n === 1) return !!$('zone').value;
  if(n === 2) return !!$('label').value.trim();
  if(n === 3) return !!$('isbn').value.trim();
  if(n === 4) return !!(getCallno());
  if(n === 5) return !!$('copyright').value.trim();
  return !!$('note').value.trim();
}
function updateSteps(){
  var done = 0, active = 0;
  for(var i = 1; i <= 6; i++){ if(stepDone(i)) done++; else if(!active) active = i; }
  for(var j = 1; j <= 6; j++){
    var d = stepDone(j), card = $('step' + j), dot = document.querySelector('#stepDots [data-s="' + j + '"]');
    card.className = 'step-card' + (d ? ' done-step' : (j === active ? ' active-step' : ''));
    dot.className = 'step-dot' + (d ? ' completed' : (j === active ? ' active' : ''));
    dot.textContent = d ? '✓' : j;
    $('st' + j).textContent = d ? '✓ 已填' : '';
  }
  $('progFill').style.width = (done / 6 * 100) + '%';
}
document.getElementById('stepDots').addEventListener('click', function(e){
  var n = e.target.getAttribute && e.target.getAttribute('data-s');
  if(n) $('step' + n).scrollIntoView({behavior:'smooth', block:'start'});
});
setInterval(updateSteps, 400);
updateSteps();

/* ===== 索書號標籤解析 =====
   標籤最多 4 欄：①特藏號（純英文）②分類號 ③作者號 ④複本號（C.n 本／V.n 冊）
   只取英數，其餘（中文、標點、貼紙）一律忽略 */
var CALLNO_JOIN = '\n';   // 輸出的分隔：'\n' 每欄一行；改成 ' ' 就是一行
function parseCallNo(raw){
  var out = {sp:'', cls:'', author:'', extra:[], notes:[], warns:[], callno:''};
  var numLines = [];
  String(raw).split(/\r?\n/).forEach(function(ln){
    // 全形標點轉半形，再把非英數、非小數點符號的字元（中文等）換成空白
    var s = ln.replace(/[：]/g,':').replace(/[；]/g,';').replace(/[，、]/g,',').replace(/[。．]/g,'.')
              .replace(/[^0-9A-Za-z.,:;\s]/g, ' ').replace(/\s+/g, ' ').trim();
    if(!s) return;
    if(/^[A-Za-z]{1,3}$/.test(s)){                                      // ① 特藏號（純英文）：只認數字行之前的字母行
      if(!out.sp && !numLines.length) out.sp = s.toUpperCase();
      return;
    }
    if(/^(?:[CVcv]\s*[.,:;]?\s*\d+\s*)+$/.test(s)){                    // ④ C.n / V.n（可同一行都有）
      s.replace(/([CVcv])\s*[.,:;]?\s*(\d+)/g, function(_, a, b){ out.extra.push(a.toUpperCase() + '.' + b); });
      return;
    }
    var n = s.replace(/\s+/g, '').replace(/^[.,:;]+|[.,:;]+$/g, '');   // 去掉前後多餘標點（例如旁邊中文被換成的符號）
    if(/^[0-9OoIl.,:;]+$/.test(n) && /\d/.test(n)){                    // ②③ 數字行
      var d = n.replace(/[Oo]/g, '0').replace(/[Il]/g, '1').replace(/(\d)[,:;](\d)/g, '$1.$2');
      if(d !== n) out.notes.push(n + ' → ' + d);
      if(/^\d+(\.\d+)?$/.test(d)) numLines.push(d);
    }
  });
  // 字母 B 被貼紙遮住時，可能被誤認成單一數字（例：8）；後面還有 2 欄以上數字就丟掉它
  if(numLines.length > 2 && numLines[0].length === 1){ out.notes.push('略過第一行「' + numLines[0] + '」（字母欄）'); numLines.shift(); }
  out.cls = numLines[0] || ''; out.author = numLines[1] || '';
  if(numLines.length > 2) out.warns.push('數字行多於 2 欄（' + numLines.slice(2).join('、') + ' 未採用），請核對');
  if(!out.cls) out.warns.push('找不到分類號');
  else if(!/^\d{3}/.test(out.cls)) out.warns.push('分類號通常是 3 位數開頭，請確認：' + out.cls);
  if(!out.author) out.warns.push('找不到作者號');
  if(out.cls || out.author) out.callno = [out.sp, out.cls, out.author].concat(out.extra).filter(Boolean).join(CALLNO_JOIN);
  return out;
}

/* ===== 索書號鏡頭：瀏覽器內建 OCR（Tesseract.js），不呼叫任何 API。只讀綠框內、按一次讀一次；錯字人工修正 =====
   第一次使用要下載辨識模組（數 MB），之後會快取。 */
var ocrBusy = false, ocrTimer = 0, ocrMode = false;

// 取得取景框內的畫面（依 object-fit: cover 換算回影片座標），長邊縮到 maxEdge
function frameCrop(maxEdge){
  var view = document.querySelector('#ov .view').getBoundingClientRect();
  var fr = document.querySelector('#ov .frame').getBoundingClientRect();
  var vw = video.videoWidth, vh = video.videoHeight;
  var sc = Math.max(view.width / vw, view.height / vh);
  var ox = (vw*sc - view.width) / 2, oy = (vh*sc - view.height) / 2;
  var sx = Math.max(0, (fr.left - view.left + ox) / sc), sy = Math.max(0, (fr.top - view.top + oy) / sc);
  var sw = Math.min(vw - sx, fr.width / sc), sh = Math.min(vh - sy, fr.height / sc);
  var k = Math.min(1, maxEdge / Math.max(sw, sh));
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw*k)); c.height = Math.max(1, Math.round(sh*k));
  c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

var ocrWorker = null, ocrWorkerLoading = null;
function loadScript(src){
  return new Promise(function(res, rej){
    var el = document.createElement('script');
    el.src = src; el.onload = res;
    el.onerror = function(){ rej(new Error('辨識模組下載失敗，請確認網路後重試')); };
    document.head.appendChild(el);
  });
}
function getOcrWorker(){
  if(ocrWorker) return Promise.resolve(ocrWorker);
  if(!ocrWorkerLoading){
    ocrWorkerLoading = (async function(){
      if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      var w = await Tesseract.createWorker('eng');
      await w.setParameters({ tessedit_pageseg_mode: '6', tessedit_char_whitelist: '0123456789.ABCV' });
      ocrWorker = w;
      return w;
    })().catch(function(e){ ocrWorkerLoading = null; throw e; });
  }
  return ocrWorkerLoading;
}
// 閒置時先在背景載入，第一次按鏡頭就不用等
window.addEventListener('load', function(){ setTimeout(function(){ getOcrWorker().catch(function(){}); }, 3000); });

// 把多次辨識的結果合併成一個：分類號選最像的、作者號選最長的、C/V 取聯集
// 已知現象：這個引擎遇到連續相同數字（例如 229、225 的「22」）會漏掉一個，分類號變成 2 位數時補回首位數字並提醒
function mergeCallNo(list){
  var out = {sp:'', cls:'', author:'', extra:[], notes:[], warns:[], callno:''};
  var clsC = [], auC = [], spC = {};
  list.forEach(function(P){
    if(P.sp) spC[P.sp] = (spC[P.sp] || 0) + 1;
    var t = [P.cls, P.author].filter(Boolean);
    if(t.length === 1 && t[0].indexOf('.') < 0){ auC.push(t[0]); }
    else { if(P.cls) clsC.push(P.cls); if(P.author) auC.push(P.author); }
    P.extra.forEach(function(x){
      if(!out.extra.some(function(y){ return y.charAt(0) === x.charAt(0); })) out.extra.push(x);
    });
    P.notes.forEach(function(n){ if(out.notes.indexOf(n) < 0) out.notes.push(n); });
  });
  var best = '', bestScore = -1;
  clsC.forEach(function(c){
    var sc = /^\d{3}(\.\d+)?$/.test(c) ? 3 : (/^\d{2}\.\d+$/.test(c) ? 1 : 0);
    if(sc > bestScore){ best = c; bestScore = sc; }
  });
  if(best && bestScore === 1){
    out.notes.push(best + ' → ' + best.charAt(0) + best + '（分類號少一位，已補上重複的首位數字）');
    best = best.charAt(0) + best;
  }
  out.cls = best;
  Object.keys(spC).forEach(function(k){ if(!out.sp || spC[k] > spC[out.sp]) out.sp = k; });
  auC.sort(function(a, b){ return b.length - a.length; });
  out.author = auC[0] || '';
  if(!out.cls) out.warns.push('找不到分類號，請手動輸入');
  if(!out.author) out.warns.push('找不到作者號，請手動輸入');
  if(out.cls || out.author) out.callno = [out.sp, out.cls, out.author].concat(out.extra).filter(Boolean).join(CALLNO_JOIN);
  return out;
}

async function openOcrCam(){
  if(scanning || ocrMode) return;
  $('ovTitle').textContent = '索書號鏡頭';
  $('ovMsg').textContent = '要求相機權限中…';
  $('ov').style.display = 'flex';
  document.querySelector('#ov .frame').className = 'frame ocr';
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:2560}, height:{ideal:1440}}, audio:false});
    track = stream.getVideoTracks()[0];
    try{ await track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
    video.srcObject = stream;
    await video.play();
    ocrMode = true;
    $('ovBar').style.display = 'block';
    $('ovMsg').textContent = '載入辨識模組…（第一次使用需下載，請稍候）';
    try{ await getOcrWorker(); }
    catch(e){ if(ocrMode) $('ovMsg').innerHTML = '<span class="w">' + escHtml((e && e.message) || e) + '</span>'; return; }
    if(ocrMode) $('ovMsg').textContent = '把索書號的所有文字對準綠框（只讀框內），手機保持約 20 公分、對焦清楚後按「讀取」';
  }catch(e){
    var msg = (e && (e.name + ': ' + e.message)) || String(e);
    $('ovMsg').innerHTML = '<span class="w">啟動失敗：' + msg + '</span>';
    stopCamera();
  }
}

function escHtml(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// 索書號四個欄位 ⇄ 字串：特藏號（英文）、分類號、作者號、複本號
function getCallno(){
  return [$('cn_sp').value.trim(), $('cn_cls').value.trim(), $('cn_author').value.trim(), $('cn_copy').value.trim()]
    .filter(Boolean).join(CALLNO_JOIN);
}
function clearCallno(){ ['cn_sp','cn_cls','cn_author','cn_copy'].forEach(function(id){ $(id).value = ''; }); refreshCallnoHint(); }
function setCallno(P){
  $('cn_sp').value = P.sp || ''; $('cn_cls').value = P.cls || ''; $('cn_author').value = P.author || '';
  $('cn_copy').value = (P.extra || []).join(' ');
  refreshCallnoHint();
}
function refreshCallnoHint(){
  var sp = $('cn_sp').value.trim(), cls = $('cn_cls').value.trim(), au = $('cn_author').value.trim(), cp = $('cn_copy').value.trim();
  var h = $('callnoHint'), w = [];
  if(!sp && !cls && !au && !cp){ h.innerHTML = ''; return; }
  if(cls && !/^\d+(\.\d+)?$/.test(cls)) w.push('分類號格式不對（應為數字，可含一個小數點）');
  else if(cls && !/^\d{3}/.test(cls)) w.push('分類號通常是 3 位數開頭，請確認');
  if(!cls || !au) w.push('分類號與作者號通常都要有');
  if(cp && !/^[CV]\.\d+(\s+[CV]\.\d+)*$/.test(cp)) w.push('複本號格式應為 C.數字（本）或 V.數字（冊），例如 C.2');
  h.innerHTML = '<span class="ok">索書號：' + escHtml(getCallno().replace(/\n/g, ' / ')) + '</span>' +
    w.map(function(x){ return '<br><span class="warn">⚠ ' + x + '</span>'; }).join('');
}
$('cn_sp').addEventListener('input', function(){ this.value = this.value.replace(/[^A-Za-z]/g, '').toUpperCase(); refreshCallnoHint(); });
$('cn_cls').addEventListener('input', function(){
  var v = this.value.replace(/[：:；;，,。．]/g, '.').replace(/[^0-9.]/g, '');
  var i = v.indexOf('.'); if(i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, '');
  this.value = v; refreshCallnoHint();
});
$('cn_author').addEventListener('input', function(){ this.value = this.value.replace(/\D/g, ''); refreshCallnoHint(); });
$('cn_copy').addEventListener('input', function(){ this.value = this.value.toUpperCase().replace(/[^CV0-9. ]/g, ''); refreshCallnoHint(); });
$('cn_copy').addEventListener('change', function(){
  this.value = this.value.replace(/([CV])\s*\.?\s*(\d+)/g, '$1.$2').replace(/\s+/g, ' ').trim(); refreshCallnoHint();
});

// 只讀一次：按「讀取」才辨識；每按一次先清空舊資料。成功就填入並關閉鏡頭，沒讀到可調整後再按
async function readOnce(){
  if(!ocrMode || ocrBusy || !video.videoWidth) return;
  ocrBusy = true;
  var btn = $('ovReadBtn'); btn.disabled = true;
  $('ovMsg').textContent = '辨識中…';
  clearCallno(); $('ocrPreview').innerHTML = ''; $('ocrHint').innerHTML = '';
  var t = performance.now(), curPsm = '6';
  try{
    var w = await getOcrWorker();
    var thumb = frameCrop(900).toDataURL('image/jpeg', 0.85);   // 先存縮圖，辨識期間手機移動也不影響
    // 同一個畫面用不同大小與版面模式各試幾次，合併結果；分類號與作者號都讀到就提早結束
    var tries = [[400,'6'],[320,'6'],[500,'6'],[400,'11'],[320,'11']];
    var results = [], raws = [], merged = null;
    for(var i = 0; i < tries.length && ocrMode; i++){
      if(tries[i][1] !== curPsm){ await w.setParameters({ tessedit_pageseg_mode: tries[i][1] }); curPsm = tries[i][1]; }
      var r = await w.recognize(frameCrop(tries[i][0]));
      raws.push(String(r.data.text || '').trim().replace(/\s*\n\s*/g, ' | '));
      results.push(parseCallNo(r.data.text));
      merged = mergeCallNo(results);
      if(merged.cls && /^\d{3}/.test(merged.cls) && merged.author && !merged.notes.some(function(n){ return n.indexOf('補上') >= 0; })) break;
    }
    if(curPsm !== '6'){ await w.setParameters({ tessedit_pageseg_mode: '6' }); }
    if(!ocrMode){ ocrBusy = false; return; }
    if(merged && merged.callno){
      setCallno(merged);
      $('ocrPreview').innerHTML = '<img src="' + thumb + '" style="max-width:100%;max-height:150px;border-radius:6px;border:1px solid #ddd">';
      $('ocrHint').innerHTML = '<span class="ok">✓ 已填入（' + Math.round((performance.now()-t)/100)/10 + ' 秒）</span>，請對照下面的縮圖核對，有錯字直接在欄位修改' +
        merged.notes.map(function(x){ return '<br><span class="warn">已修正：' + escHtml(x) + '</span>'; }).join('') +
        merged.warns.map(function(x){ return '<br><span class="warn">⚠ ' + x + '</span>'; }).join('') +
        '<br><span style="color:#999">辨識原文：' + escHtml(raws.filter(Boolean).slice(0, 2).join('　／　') || '（空）') + '</span>';
      ocrBusy = false; btn.disabled = false;
      closeScan();
      saveDraft();
      return;
    }
    $('ovMsg').innerHTML = '<span class="w">沒有讀到索書號</span>，請把文字對準綠框、對焦清楚後再按一次，或關閉鏡頭直接輸入' +
      '<br><span style="opacity:.7;font-size:12px">辨識原文：' + escHtml(raws.filter(Boolean).slice(0, 2).join('　／　') || '（空）') + '</span>';
  }catch(e){
    $('ovMsg').innerHTML = '<span class="w">辨識失敗：' + escHtml((e && e.message) || e) + '</span>';
  }
  ocrBusy = false; btn.disabled = false;
}

window.addEventListener('pagehide', closeScan);
</script>
