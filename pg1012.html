<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>實景地圖｜法會停車場至各休息區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E9F0F4; --surface:#FFFFFF; --ink:#16222E; --muted:#51606E; --line:#CBD6DE;
  --sign:#1E4677; --sign-ink:#FFFFFF; --sign-soft:#DCE6F2; --pin:#E0161B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#0F1820;--surface:#18242F;--ink:#E7EEF4;--muted:#9FB0BF;--line:#2C3C4A;--sign:#3B6FB0;--sign-soft:#1F3148}
}
:root[data-theme="dark"]{--page:#0F1820;--surface:#18242F;--ink:#E7EEF4;--muted:#9FB0BF;--line:#2C3C4A;--sign:#3B6FB0;--sign-soft:#1F3148}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);display:flex;flex-direction:column;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;font-size:18px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sign);outline-offset:2px}

.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.title{font-weight:900;font-size:19px;background:var(--sign);color:var(--sign-ink);padding:1px 10px;border-radius:5px;white-space:nowrap}
.hint{color:var(--muted);font-size:16px;display:flex;align-items:center;gap:6px}
.hint i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--pin);border:2px solid #fff;box-shadow:0 0 0 1px var(--pin)}
.places{order:5;flex:1 1 100%;display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.places .chip{flex:none;white-space:nowrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 12px;font-size:17px}
.zoom{margin-left:auto;display:flex;gap:4px}
@media (max-width:480px){.hint{font-size:0;gap:0}.hint i{margin-right:0}}
.zbtn{border:2px solid var(--sign);background:var(--surface);border-radius:6px;min-width:40px;padding:0 8px;font-weight:700;font-size:18px;line-height:1.6}

.view{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;background:#E6DCC8}
.stage{position:relative;width:100%;transform-origin:0 0}
.stage img.map{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;border:1.5px solid #fff;
  background:var(--pin);box-shadow:0 1px 4px rgba(0,0,0,.45);padding:0}
.pin::before{content:"";position:absolute;inset:-6px;border-radius:50%}
.pin::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--pin);opacity:0;animation:ping 2s ease-out infinite}
.pin.seen::after{animation:none;opacity:0}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin::after{animation:none}}
.pin .tip{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;
  background:rgba(22,34,46,.88);color:#fff;font-size:15px;font-weight:700;padding:1px 8px;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .15s}
.pin:hover .tip,.pin:focus-visible .tip{opacity:1}
.pin:hover,.pin:focus-visible{z-index:3}

.lb{position:fixed;inset:0;z-index:20;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center}
.lbpanel{width:auto;min-width:280px;max-width:66.7vw;background:#111;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
@media (max-width:700px){.lbpanel{max-width:94vw}.lbimg img{max-width:94vw!important}}
.lb[hidden]{display:none}
.lbtop{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;color:#fff}
.lbtop h2{margin:0;font-size:20px;flex:1}
.lbtop .count{font-size:16px;opacity:.8;font-variant-numeric:tabular-nums}
.lbimg{position:relative;touch-action:pan-y;background:#000;min-height:220px;display:flex;align-items:center;justify-content:center}
.lbimg img{position:relative;z-index:1}
.lbimg img{width:auto;height:auto;max-width:66.7vw;max-height:66.7vh;display:block;margin:0 auto}
.lb-btn{position:absolute;z-index:2;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:34px;line-height:1;width:52px;height:52px;border-radius:50%}
.close{position:static;font-size:22px;width:40px;height:40px;background:rgba(255,255,255,.15)}
.lb-btn.prev,.lb-btn.next{width:46px;height:46px;font-size:30px}
.prev{left:10px;top:50%;transform:translateY(-50%)} .next{right:10px;top:50%;transform:translateY(-50%)}
.lb-btn[hidden]{display:none}
.lbload{position:absolute;inset:0;z-index:0;margin:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;min-width:280px;text-align:center;padding:0 16px}
</style>
</head>
<body>
<div class="bar">
  <span class="title">實景地圖</span>
  <span class="hint" title="點紅點看實景照片"><i></i>點紅點看實景照片</span>
  <div class="zoom">
    <button class="zbtn" id="zout" aria-label="縮小">－</button>
    <button class="zbtn" id="zfit">全圖</button>
    <button class="zbtn" id="zin" aria-label="放大">＋</button>
  </div>
</div>
<div class="view" id="view">
  <div class="stage" id="stage"><img class="map" id="map" alt="法會停車場至各休息區步行動線圖" src="map.jpg"></div>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="實景照片">
 <div class="lbpanel">
  <div class="lbtop"><span class="count" id="lbCount" style="flex:1"></span><button class="lb-btn close" id="close" aria-label="關閉">✕</button></div>
  <div class="lbimg" id="lbimg">
    <img id="lbPhoto" alt="">
    <p class="lbload" id="lbLoad">照片載入中…</p>
    <button class="lb-btn prev" id="prev" aria-label="上一個地點">‹</button>
    <button class="lb-btn next" id="next" aria-label="下一個地點">›</button>
  </div>
 </div>
</div>

<script>
const D = {mw:3200, mh:2102, points:[{"x": 39.3, "y": 20.6}, {"x": 42.0, "y": 22.3}, {"x": 39.3, "y": 32.4}, {"x": 37.5, "y": 39.8}, {"x": 46.8, "y": 31.4}, {"x": 71.6, "y": 27.9}, {"x": 80.3, "y": 41.0}, {"x": 79.9, "y": 38.0}, {"x": 75.5, "y": 38.0}, {"x": 42.5, "y": 34.6}, {"x": 44.0, "y": 36.9}, {"x": 46.0, "y": 42.3}, {"x": 42.6, "y": 44.4}, {"x": 44.4, "y": 45.6}, {"x": 47.5, "y": 50.0}, {"x": 46.0, "y": 52.3}, {"x": 51.0, "y": 52.3}, {"x": 42.5, "y": 65.4}, {"x": 44.2, "y": 65.4}, {"x": 38.75, "y": 19.2}, {"x": 38.0, "y": 35.4}, {"x": 37.5, "y": 42.3}, {"x": 48.2, "y": 32.8}, {"x": 50.9, "y": 36.138}, {"x": 49.067, "y": 34.6}, {"x": 51.0, "y": 38.638}, {"x": 51.2, "y": 43.838}, {"x": 52.8, "y": 42.3}, {"x": 57.75, "y": 44.223}, {"x": 62.5, "y": 43.5}, {"x": 44.25, "y": 60.0}, {"x": 56.0, "y": 65.4}, {"x": 57.5, "y": 74.6}, {"x": 59.0, "y": 75.4}, {"x": 32.5, "y": 43.5}, {"x": 52.5, "y": 50.0}, {"x": 67.5, "y": 44.6}, {"x": 36.0, "y": 42.3}, {"x": 44.0, "y": 34.6}]};
const PH = D.points.map((_,i)=>`${String(i+1).padStart(2,'0')}.jpg`);
let photosReady=true, pending=null;
const $ = s => document.querySelector(s);
const view=$('#view'), stage=$('#stage');

/* pins */
const pins=[];
D.points.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='pin'; b.style.left=p.x+'%'; b.style.top=p.y+'%';
  b.setAttribute('aria-label',`實景照片 ${i+1}`);
  b.onclick=()=>openLb(i);
  stage.append(b); pins.push(b);
});

/* zoom: stage width = zoom × view width; keep the centre point steady */
let zoom=1;
function setZoom(z, cx, cy){
  z=Math.max(1,Math.min(5,z));
  const r=view.getBoundingClientRect();
  cx = cx ?? r.width/2; cy = cy ?? r.height/2;
  const fx=(view.scrollLeft+cx)/stage.offsetWidth, fy=(view.scrollTop+cy)/stage.offsetHeight;
  zoom=z; stage.style.width=(z*100)+'%';
  view.scrollLeft=fx*stage.offsetWidth-cx; view.scrollTop=fy*stage.offsetHeight-cy;
  $('#zout').disabled = z<=1; $('#zin').disabled = z>=5;
}
$('#zin').onclick=()=>setZoom(zoom*1.5);
$('#zout').onclick=()=>setZoom(zoom/1.5);
$('#zfit').onclick=()=>{ setZoom(1); view.scrollTo(0,0); };
view.addEventListener('dblclick',e=>{ const r=view.getBoundingClientRect(); setZoom(zoom*1.5,e.clientX-r.left,e.clientY-r.top); });
view.addEventListener('wheel',e=>{ if(!e.ctrlKey) return; e.preventDefault(); const r=view.getBoundingClientRect(); setZoom(zoom*(e.deltaY<0?1.15:1/1.15),e.clientX-r.left,e.clientY-r.top); },{passive:false});
/* two-finger pinch inside the map */
(function(){ let d0=null,z0=1,mid=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  view.addEventListener('touchstart',e=>{ if(e.touches.length===2){ d0=dist(e.touches); z0=zoom; const r=view.getBoundingClientRect(); mid=[(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,(e.touches[0].clientY+e.touches[1].clientY)/2-r.top]; } },{passive:true});
  view.addEventListener('touchmove',e=>{ if(d0&&e.touches.length===2){ e.preventDefault(); setZoom(z0*dist(e.touches)/d0,mid[0],mid[1]); } },{passive:false});
  view.addEventListener('touchend',e=>{ if(e.touches.length<2) d0=null; });
})();
/* phones in portrait: start zoomed so the map fills the screen height */
function initialZoom(){
  const r=view.getBoundingClientRect(); const ratio=D.mh/D.mw;
  const fit = r.height/(r.width*ratio);
  if(fit>1.3){ setZoom(Math.min(fit,3)); view.scrollLeft=(stage.offsetWidth-r.width)*0.42; }
  else setZoom(1);
}
if($('#map').complete) initialZoom(); else $('#map').addEventListener('load',initialZoom);

/* photo viewer */
let cur=0;
function show(){
  const p=D.points[cur];
  pins[cur].classList.add('seen');
  $('#lbPhoto').alt=`實景照片 ${cur+1}`;
  const img=$('#lbPhoto'), msg=$('#lbLoad'), n=String(cur+1).padStart(2,'0');
  const tries=[`${n}.jpg`,`photos/${n}.jpg`,`${n}.JPG`,`photos/${n}.JPG`];
  let k=0;
  msg.textContent='照片載入中…';
  img.style.visibility='visible';
  img.onerror=()=>{ k++; if(k<tries.length){ img.src=tries[k]; } else { img.style.visibility='hidden'; msg.textContent=`照片無法載入（找不到 ${n}.jpg）`; } };
  img.removeAttribute('src');
  img.src=tries[0];
  [cur+1,cur-1].forEach(k=>{ const j=(k+PH.length)%PH.length; const pre=new Image(); pre.src=PH[j]; });
  const many=D.points.length>1;
  $('#lbCount').textContent = many ? `${cur+1} / ${D.points.length}` : '';
  $('#prev').hidden=!many; $('#next').hidden=!many;
}
function openLb(i){ cur=i; show(); $('#lb').hidden=false; $('#close').focus(); }
function closeLb(){ $('#lb').hidden=true; }
$('#close').onclick=closeLb;
$('#lb').addEventListener('click',e=>{ if(e.target.id==='lb') closeLb(); });
$('#prev').onclick=()=>{ cur=(cur-1+D.points.length)%D.points.length; show(); };
$('#next').onclick=()=>{ cur=(cur+1)%D.points.length; show(); };
document.addEventListener('keydown',e=>{ if($('#lb').hidden) return;
  if(e.key==='Escape') closeLb(); else if(e.key==='ArrowRight') $('#next').click(); else if(e.key==='ArrowLeft') $('#prev').click(); });
(function(){ let x0=null; const l=$('#lbimg');
  l.addEventListener('touchstart',e=>{ if(e.touches.length===1) x0=e.touches[0].clientX; },{passive:true});
  l.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>50 && D.points.length>1){ dx<0?$('#next').click():$('#prev').click(); } });
})();
</script>
</body>
</html>
