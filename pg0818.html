  }

  body{
    margin:0;
    background:var(--paper);

      radial-gradient(circle at 10% 0%, rgba(169,125,60,0.06), transparent 40%),

    color:var(--ink);

  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  header{
    text-align:center;
    padding:18px 10px 22px;
  }
  header .eyebrow{
    font-size:14px;
    letter-spacing:2px;
    color:var(--gold-deep);
    margin-bottom:6px;
  }
  header h1{
    font-size:24px;
    margin:0 0 6px;
    font-weight:700;
    letter-spacing:1px;
  }
  header p{
    font-size:15px;
    color:var(--ink-soft);
    margin:0;
  }

  .search-box{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--paper);
    padding:10px 0 14px;
  }
  .search-box input{
    width:100%;
    font-size:20px;
    padding:14px 16px;
    border-radius:14px;
    border:2px solid var(--line);
    background:var(--card);
    color:var(--ink);
    outline:none;
    font-family:inherit;
  }
  .search-box input:focus{
    border-color:var(--gold);
  }
  .hint{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:6px;
  }

  .count{
    font-size:14px;
    color:var(--ink-soft);
    margin:4px 4px 12px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .card .name-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:10px;
    border-bottom:1px dashed var(--line);
    padding-bottom:10px;
  }
  .card .name{
    font-size:22px;
    font-weight:700;
    color:var(--ink);
  }
  .card .fname{
    font-size:16px;
    color:var(--gold-deep);
  }
  .card .fields{
    display:grid;
    grid-template-columns:64px 1fr;
    row-gap:8px;
    column-gap:10px;
    font-size:17px;
  }
  .card .label{
    color:var(--ink-soft);
    font-size:14px;
    padding-top:2px;
  }
  .card .value{
    color:var(--ink);
    line-height:1.5;
  }
  .badge{
    display:inline-block;
    background:var(--paper-deep);
    color:var(--gold-deep);
    border:1px solid var(--line);
    border-radius:999px;
    padding:2px 12px;
    font-size:15px;
  }
  .car-badge{
    background:#eef3ea;
    color:#4a6b3a;
    border-color:#c7d8bd;
    font-weight:700;
  }
  .time-value{
    font-weight:700;
    color:var(--gold-deep);
  }
  .note{
    margin-top:12px;
    padding:10px 12px;
    background:#fbeee0;
    border:1px solid var(--gold);
    border-radius:10px;
    font-size:14px;
    color:var(--gold-deep);
    line-height:1.5;
  }
  .note b{
    color:var(--ink);
  }

  .group-header{
    font-size:15px;
    font-weight:700;
    color:var(--gold-deep);
    margin:22px 4px 10px;
    padding-bottom:6px;
    border-bottom:2px solid var(--gold);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .group-header .n{
    font-size:12px;
    font-weight:400;
    color:var(--ink-soft);
  }

  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:40px 10px;
    font-size:16px;
  }

</style>

const groupCounts = {};
people.forEach(p => { groupCounts[p.group] = (groupCounts[p.group] || 0) + 1; });
const groupOrder = Object.keys(groupCounts).sort((a, b) => groupCounts[b] - groupCounts[a]);

people.sort((a, b) => {
  const ga = groupOrder.indexOf(a.group);
  const gb = groupOrder.indexOf(b.group);
  if(ga !== gb) return ga - gb;
  return a.name.localeCompare(b.name, 'zh-Hant');
});

const listEl = document.getElementById('list');
const countEl = document.getElementById('countText');
const emptyEl = document.getElementById('emptyMsg');
const input = document.getElementById('searchInput');

function render(items, groupByHeaders){
  listEl.innerHTML = '';
  if(items.length === 0){
    emptyEl.style.display = 'block';
    countEl.textContent = '';
    return;
  }
  emptyEl.style.display = 'none';
  countEl.textContent = '共 ' + items.length + ' 筆';

  let lastGroup = null;
  items.forEach(p => {
    if(groupByHeaders && p.group !== lastGroup){
      lastGroup = p.group;
      const groupCount = items.filter(x => x.group === p.group).length;
      const header = document.createElement('div');
      header.className = 'group-header';
      header.innerHTML = `<span>${p.group}</span><span class="n">共 ${groupCount} 人</span>`;
      listEl.appendChild(header);
    }
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="name-row">
        <span class="name">${p.name}</span>
        <span class="fname">${p.fname}</span>
      </div>
      <div class="fields">
        <div class="label">車次</div>
        <div class="value"><span class="badge car-badge">${p.car}</span></div>
        <div class="label">寮房</div>
        <div class="value">${p.room || '未查得'}</div>
        <div class="label">組別</div>
        <div class="value"><span class="badge">${p.group}</span></div>
        <div class="label">上線</div>
        <div class="value time-value">${p.time}</div>
        <div class="label">地點</div>
        <div class="value">${p.loc}</div>
      </div>
      ${p.note ? `<div class="note"><b>提醒：</b>${p.note}</div>` : ''}
    `;
    listEl.appendChild(card);
  });
}

function filterAndRender(){
  const q = input.value.trim();
  if(q === ''){
    render(people, true);
    return;
  }
  const filtered = people.filter(p => p.name.includes(q) || p.fname.includes(q));
  render(filtered, false);
}

input.addEventListener('input', filterAndRender);
render(people, true);
