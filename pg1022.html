  header h1{font-family:'Noto Serif TC',serif;font-size:21px;font-weight:500;letter-spacing:.1em;color:var(--ink)}

  .squad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
  .squad-btn{padding:13px 4px;font-size:24px;font-family:'Noto Sans TC',sans-serif;font-weight:500;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--ink);cursor:pointer;line-height:1;transition:background .15s,border-color .15s}
  .squad-btn:hover{border-color:var(--moss)}
  .squad-btn:active,.squad-btn.active{background:var(--charcoal);border-color:var(--charcoal);color:var(--bg)}
  .divider{height:1px;background:var(--line);margin-bottom:18px}
  .result-info{font-size:16px;color:var(--ink-soft);margin-bottom:12px;min-height:24px;letter-spacing:.04em}
  .result-count{font-weight:700;color:var(--ink)}
  .squad-block{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .squad-block-title{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:500;letter-spacing:.1em;color:var(--ink);padding:14px 20px 12px;border-bottom:1px solid var(--line);border-left:2px solid var(--moss)}
  .squad-block-title .count{font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:400;letter-spacing:.04em;color:var(--ink-soft);margin-left:10px}
  .member-row{display:flex;align-items:baseline;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .member-row.male{box-shadow:inset 0 0 0 3px #8fdc9a}
  .member-row:last-child{border-bottom:none}
  .member-name{font-size:21px;font-weight:500;color:var(--ink);flex:0 0 auto}
  .member-dharma{font-size:18px;color:var(--ink-soft);flex:0 0 auto}
  .member-seat{font-size:18px;font-weight:700;color:var(--gold-text);flex:0 0 auto;margin-left:10px}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:20px}
  .squad-grid-wrap{overflow:hidden;transition:max-height .3s ease,opacity .3s ease;max-height:600px;opacity:1}
  .squad-grid-wrap.collapsed{max-height:0;opacity:0}
  .back-btn{display:none;width:100%;padding:13px 16px;font-size:20px;font-family:'Noto Sans TC',sans-serif;font-weight:500;background:transparent;border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--ink);cursor:pointer;margin-bottom:16px;letter-spacing:1px;text-align:left}
  .back-btn.visible{display:block}
  .search{display:block;width:100%;padding:13px 16px;font-size:20px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:16px;letter-spacing:.04em;outline:none;-webkit-appearance:none;appearance:none}
  .search::placeholder{color:#A39D93}
  .search:focus{border-color:var(--moss)}
  .member-squad{font-size:15px;color:var(--ink-soft);margin-left:10px;flex:0 0 auto}
  mark{background:var(--moss-light);color:var(--ink);border-bottom:2px solid var(--moss);padding:0 1px}
</style>
</head>

const SQUADS = Array.from({length:36},(_,i)=>`第${i+1}小隊`);
const bySquad = {};
SQUADS.forEach(s => bySquad[s] = []);
RAW.forEach(r => {
  const [seat,squad,name,dharma,gender] = r;
  if(bySquad[squad]) bySquad[squad].push({seat,squad,name,dharma,gender});
});
const ALL = RAW.map(r => ({seat:r[0],squad:r[1],name:r[2],dharma:r[3],gender:r[4]}));
const sqNum = s => parseInt(s.replace(/[^0-9]/g,''));

let activeSquad = null, query = '';
const input = document.getElementById('q');

const grid = document.getElementById('squadGrid');
SQUADS.forEach(sq => {
  const n = sqNum(sq);
  const btn = document.createElement('button');
  btn.className = 'squad-btn';
  btn.textContent = n;
  btn.title = sq;
  btn.onclick = () => toggleSquad(sq, btn);
  btn.id = 'sq-' + n;
  grid.appendChild(btn);
});

function toggleSquad(sq, btn) {
  if(activeSquad === sq) { clearAll(); return; }
  document.querySelectorAll('.squad-btn').forEach(b=>b.classList.remove('active'));
  activeSquad = sq;
  input.value = ''; query = '';
  btn.classList.add('active');
  render();
}

function clearAll() {
  activeSquad = null; query = ''; input.value = '';
  document.querySelectorAll('.squad-btn').forEach(b=>b.classList.remove('active'));
  render();
}

function onSearch() {
  query = input.value.replace(/\s+/g,'');
  if(query) { activeSquad = null; document.querySelectorAll('.squad-btn').forEach(b=>b.classList.remove('active')); }
  render();
}
input.addEventListener('input', e => { if(!e.isComposing) onSearch(); });
input.addEventListener('compositionend', onSearch);

function esc(t){ return String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function hi(t){
  t = String(t);
  if(!query) return esc(t);
  const i = t.indexOf(query);
  if(i < 0) return esc(t);
  return esc(t.slice(0,i)) + '<mark>' + esc(t.slice(i,i+query.length)) + '</mark>' + esc(t.slice(i+query.length));
}

function render() {
  const info = document.getElementById('resultInfo');
  const list = document.getElementById('cardList');
  const showing = !!(activeSquad || query);
  document.getElementById('squadGridWrap').classList.toggle('collapsed', showing);
  document.getElementById('backBtn').classList.toggle('visible', showing);

  if(query) {
    const rs = ALL.filter(p => p.name.includes(query) || (p.dharma||'').includes(query))
                  .sort((a,b) => sqNum(a.squad) - sqNum(b.squad));
    if(!rs.length) {
      info.innerHTML = '';
      list.innerHTML = '<div class="empty">找不到「' + esc(query) + '」</div>';
      return;
    }
    info.innerHTML = `搜尋「${esc(query)}」　共 <span class="result-count">${rs.length}</span> 人`;
    const rows = rs.map(p => `<div class="member-row">
    <span class="member-name">${hi(p.name)}</span>
    <span class="member-dharma">／${hi(p.dharma)}</span>
    <span class="member-seat">　${p.seat}</span>
    <span class="member-squad">${p.squad}</span>
  </div>`).join('');
    list.innerHTML = `<div class="squad-block">${rows}</div>`;
    return;
  }

  if(!activeSquad) {
    info.innerHTML = '';
    list.innerHTML = '';
    return;
  }

  const results = bySquad[activeSquad] || [];

  info.innerHTML = `${activeSquad}　共 <span class="result-count">${results.length}</span> 人　<span style="border:2px solid #8fdc9a;border-radius:4px;padding:0 6px;font-size:14px">男眾</span>`;

  const rows = results.map(p => `<div class="member-row${p.gender==='男'?' male':''}">
    <span class="member-name">${p.name}</span>
    <span class="member-dharma">／${p.dharma}</span>
    <span class="member-seat">　${p.seat}</span>
  </div>`).join('');

  list.innerHTML = `<div class="squad-block">
    <div class="squad-block-title">${activeSquad}<span class="count">${results.length} 人</span></div>
    ${rows}
  </div>`;
}

render();
</script>
