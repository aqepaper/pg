<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>領隊直通關／帶隊大考驗｜中台禪寺路線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E9F0F4; --surface:#FFFFFF; --ink:#16222E; --muted:#51606E; --line:#CBD6DE;
  --sign:#1E4677; --sign-ink:#FFFFFF; --sign-soft:#DCE6F2;
  --ok:#23704A; --ok-soft:#DDF1E5; --bad:#B3261E; --bad-soft:#FBE3E1;
  --route:#B400E6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0F1820; --surface:#18242F; --ink:#E7EEF4; --muted:#9FB0BF; --line:#2C3C4A;
    --sign:#3B6FB0; --sign-ink:#FFFFFF; --sign-soft:#1F3148;
    --ok:#6CCB98; --ok-soft:#173A29; --bad:#F2877F; --bad-soft:#40201D;
  }
}
:root[data-theme="dark"]{
  --page:#0F1820; --surface:#18242F; --ink:#E7EEF4; --muted:#9FB0BF; --line:#2C3C4A;
  --sign:#3B6FB0; --sign-ink:#FFFFFF; --sign-soft:#1F3148;
  --ok:#6CCB98; --ok-soft:#173A29; --bad:#F2877F; --bad-soft:#40201D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{margin:0 auto;padding:0 12px 48px}
.lede,.hint,.hero-note,.seg,.routes,.stops,.row,.toggle,h2{max-width:1100px}
.photo{width:100%;min-height:200px}
.ld{position:absolute;inset:0;z-index:0;margin:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;pointer-events:none}
.ld-dark{color:#fff}
.photo img,.lb img{position:relative;z-index:1}
.lb-btn,.lb-count{z-index:2}
.photo img{width:100%;height:auto;max-height:max(240px,calc(100vh - 104px));object-fit:contain;display:block}
@media (max-width:700px){
  .hero,.mapbox,.viewer{margin-left:-12px;margin-right:-12px;border-radius:0;border-left:0;border-right:0}
  .qcard{margin-left:-12px;margin-right:-12px;border-radius:0;border-left:0;border-right:0}
  .qmedia{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0}
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sign);outline-offset:2px}

/* header */
header{padding:22px 0 14px}
.sign{display:inline-block;background:var(--sign);color:var(--sign-ink);font-weight:900;
  font-size:clamp(20px,calc((100vw - 56px) / 11.4),40px);line-height:1.15;padding:10px 16px 12px;border-radius:6px;letter-spacing:.02em;white-space:nowrap}
.lede{margin:12px 0 0;color:var(--muted);font-size:17px}
.hero{margin-top:16px;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.hero svg{display:block;width:100%;height:auto}
.hero-note{font-size:15px;color:var(--muted);margin:8px 2px 0}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);
  display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:10px 0;margin-top:14px}
.tab{border:2px solid var(--sign);background:var(--surface);border-radius:8px;padding:10px 4px;
  font-weight:700;font-size:18px}
.tab[aria-selected="true"]{background:var(--sign);color:var(--sign-ink)}
section[hidden]{display:none}
section,#quizBox{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 80px)}
.viewer{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 50px)}
h2{font-size:22px;margin:18px 0 8px}
.hint{color:var(--muted);font-size:16px;margin:0 0 12px}

/* chips */
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:17px}
.chip[aria-pressed="true"]{border-color:var(--sign);background:var(--sign-soft);font-weight:700}

.routes{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.route-btn{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);
  background:var(--surface);border-radius:10px;padding:12px 14px;font-size:18px}
.route-btn[aria-pressed="true"]{border-color:var(--sign);box-shadow:inset 0 0 0 1.5px var(--sign)}
.swatch{flex:none;width:28px;height:6px;border-radius:3px}

.mapbox{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.stops{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0}
.stop{background:var(--sign);color:var(--sign-ink);border-radius:5px;padding:4px 10px;font-weight:700;font-size:17px}
.arrow{color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--sign);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:700;font-size:17px}
.btn.primary{background:var(--sign);color:var(--sign-ink)}
.btn[disabled]{opacity:.4;cursor:default}

/* route drawing */
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3s ease-in-out forwards}
.enddot{opacity:0;animation:pop .3s ease-out 2.9s forwards}
@keyframes pop{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.enddot{animation:none;opacity:1}}

/* viewer */
.viewer{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.photo{position:relative;background:var(--surface);touch-action:pan-y;cursor:pointer}

.tap{margin:0;padding:8px 14px;background:var(--sign-soft);color:var(--ink);font-size:17px;text-align:center}
.tap[hidden]{display:none}
.vbar{display:flex;align-items:center;gap:8px;padding:6px 10px}
.vmid{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 10px;text-align:center;min-width:0}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.part{color:var(--muted);font-size:16px;line-height:1.3}
.lb{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.lb[hidden]{display:none}
.lb img{width:100vw;height:100vh;object-fit:contain}
.lb-btn{position:absolute;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:34px;line-height:1;width:52px;height:52px;border-radius:50%}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;font-size:26px}
.lb-prev{left:10px;top:50%;transform:translateY(-50%)}
.lb-next{right:10px;top:50%;transform:translateY(-50%)}
.lb-count{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 12px;font-size:17px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px;justify-content:center;padding:0 12px 12px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--sign)}
.dots[hidden]{display:none}
.toggle{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:17px}
.toggle input{width:22px;height:22px;accent-color:var(--sign)}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:16px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--sign);transition:width .3s}
.qtext{font-size:20px;font-weight:700;margin:0 0 12px}
.qmedia{margin-bottom:14px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.qmedia svg{display:block;width:100%;height:auto}
.qmedia img{width:100%;height:auto}
.qside .qtext{margin-top:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:18px}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin:12px 0 0;font-weight:700}
.feedback.good{color:var(--ok)} .feedback.bad{color:var(--bad)}
.score{font-size:56px;font-weight:900;color:var(--sign);line-height:1;margin:6px 0}
.lost{margin-top:14px;padding:14px;border-radius:8px;background:var(--sign-soft);font-size:17px}
.lost b{display:block;font-size:19px;margin-bottom:4px}
ul.review{padding-left:20px;margin:10px 0 0;font-size:16px;color:var(--muted)}
footer{margin-top:32px;font-size:14px;color:var(--muted);text-align:center}

/* desktop: left sidebar */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:320px minmax(0,1fr)}
  .side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 14px 24px;
    background:var(--surface);border-right:1px solid var(--line)}
  .side .tabs{position:static;grid-template-columns:1fr;margin:0 0 6px;padding:0;background:none}
  .side .tab{padding:12px 8px;font-size:19px}
  .side .ctl{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
  body[data-tab="learn"] .side .ctl[data-ctl="learn"],
  body[data-tab="walk"] .side .ctl[data-ctl="walk"]{display:block}
  .side #learnB{border-top:0;margin-top:0;padding-top:0}
  .side .row .btn{flex:1 1 100%}
  .side h2{font-size:19px;margin:10px 0 8px}
  .wrap{margin:0;width:100%;padding:0 20px 40px;min-height:100vh}
  .mapbox svg{margin:0 auto}
  .side .stops{margin:0 0 12px}
  section{min-height:100vh;padding-top:16px}
  .qgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:20px;align-items:start}
  .qmedia{margin-bottom:0}
  .qmedia img,.qmedia svg{max-height:calc(100vh - 150px);object-fit:contain;background:#fff}
  section,#quizBox,.viewer{scroll-margin-top:16px}
  #learn{padding-top:16px}
  .mapbox svg{max-height:calc(100vh - 32px)}
  .photo img{max-height:max(240px,calc(100vh - 86px))}
  .viewer{scroll-margin-top:8px}
}
@media (max-width:899px){ .side{display:none} }

/* compact text cards (half height) */
@media (max-width:600px){.vbar{flex-wrap:wrap}.vmid{order:-1;flex-basis:100%}#zoom{margin-left:auto}}

.tabs{padding:6px 0}
.tab{padding:3px 4px;line-height:1.3}
.chip{padding:2px 12px;line-height:1.3}
.route-btn{padding:3px 12px;line-height:1.3}
.btn{padding:2px 12px;line-height:1.3}
.stop{padding:1px 8px;line-height:1.3}
.opt{padding:4px 12px;line-height:1.3}
#learnB{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
body:not([data-tab="learn"]) #learnB{display:none}
#learnB .stops,#learnB .row{margin:0}
@media (min-width:900px){
  .side .tab{padding:4px 8px}
  .side .row .btn{flex:1 1 auto}
}
</style>
</head>
<body data-tab="learn">
<div class="app">
<aside class="side" id="side" aria-label="功能選單"></aside>
<div class="wrap">
<header>
  <h1 class="sign">領隊直通關／帶隊大考驗</h1>
  <p class="lede">從停車場走到圓明殿，您記得怎麼走嗎？先認路線，再看實景。</p>
  <div class="hero" id="hero"></div>
  <p class="hero-note">點地圖上的「淨覺」或「妙覺」，直接看從那裡出發的路線。</p>
</header>

<span id="ph-tabs"></span>
<nav class="tabs" role="tablist" id="tabs">
  <button class="tab" role="tab" aria-selected="true" data-tab="learn">認路線</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="walk">看實景</button>
</nav>

<section id="learn" role="tabpanel">
  <span id="ph-learnA"></span>
  <div class="ctl" data-ctl="learn" id="learnA">
    <h2>從哪裡出發？</h2>
    <div class="seg" id="origins"></div>
    <div class="routes" id="routeList"></div>
  </div>
  <div class="mapbox" id="learnMap"></div>
  <span id="ph-learnB"></span>
  <div class="ctl" data-ctl="learn" id="learnB">
    <div class="stops" id="learnStops"></div>
    <div class="row">
      <button class="btn" id="redraw">再走一次</button>
      <button class="btn primary" id="toWalk" hidden>看這條路的實景</button>
    </div>
  </div>
</section>

<section id="walk" role="tabpanel" hidden>
  <span id="ph-walkA"></span>
  <div class="ctl" data-ctl="walk" id="walkA">
    <h2>跟著照片走一遍</h2>
    <div class="seg" id="walkList"></div>
    <label class="toggle"><input type="checkbox" id="guess"> 先猜再看：照片先不顯示箭頭，點一下才揭曉</label>
  </div>
  <div class="viewer">
    <div class="vbar">
      <button class="btn" id="prev">上一張</button>
      <span class="vmid"><span class="part" id="partName"></span><span class="count" id="count"></span></span>
      <button class="btn" id="zoom" aria-label="全螢幕看照片">全螢幕</button>
      <button class="btn primary" id="next">下一張</button>
    </div>
    <p class="tap" id="cover" hidden>先想想往哪走，再點照片看答案</p>
    <div class="photo" id="photo"><p class="ld">照片載入中…</p><img id="photoImg" alt=""></div>
    <div class="dots" id="dots" hidden></div>
  </div>
  <div class="lb" id="lb" hidden role="dialog" aria-label="全螢幕照片">
    <p class="ld ld-dark">照片載入中…</p>
    <img id="lbImg" alt="">
    <button class="lb-btn lb-close" id="lbClose" aria-label="關閉">✕</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="上一張">‹</button>
    <button class="lb-btn lb-next" id="lbNext" aria-label="下一張">›</button>
    <span class="lb-count" id="lbCount"></span>
  </div>
</section>


<footer>普高精舍 回山領隊培訓</footer>
</div>
</div>

/* ---------- map svg ---------- */
function mapSVG(route, {labels=true}={}){
  const m = DATA.maps[route.map];
  const sw = m.w/140, c = 'var(--route)';
  const d = route.segs.map((s,i)=> i ? s[0].replace(/^\s*M/,'L') : s[0]).join(' ');
  const nums = d.match(/-?\d+\.?\d*/g).map(Number);
  const [x0,y0] = nums, [x1,y1] = nums.slice(-2);
  const dot = (x,y,cls='') => `<circle cx="${x}" cy="${y}" r="${sw*1.8}" fill="${c}" stroke="#fff" stroke-width="${sw*0.6}" class="${cls}"/>`;
  return `<svg viewBox="0 0 ${m.w} ${m.h}" role="img" aria-label="${labels?route.name:'路線圖'}"><image href="${m.src}" width="${m.w}" height="${m.h}"/>
    <path d="${d}" fill="none" stroke="#fff" stroke-width="${sw*2.2}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="opacity:.85"/>
    <path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw"/>
    ${dot(x0,y0)}${dot(x1,y1,'enddot')}</svg>`;
}

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="中台禪寺全區平面圖"><image href="${m.src}" width="${W}" height="${H}"/>`;

/* ---------- tabs ---------- */
let userNav=false, mq=null;
const scrollMain=t=>{ if(mq&&mq.matches) $('#'+t).scrollIntoView({block:'start'}); };
function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ['learn','walk'].forEach(id=>$('#'+id).hidden = id!==t);
  store.set('tab',t);
  document.body.dataset.tab=t;
  if(mq && mq.matches && userNav) $('#'+t).scrollIntoView({block:'start'});
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{userNav=true;switchTab(b.dataset.tab);}));

/* ---------- learn ---------- */
let curOrigin='miao', curRoute=null;
ORIGINS.forEach(o=>{
  const b=el('button',{class:'chip','aria-pressed':'false','data-o':o.id},o.name);
  b.onclick=()=>{pickOrigin(o.id);scrollMain('learn');}; $('#origins').append(b);
});
function pickOrigin(id){
  curOrigin=id;
  $('#origins').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.o===id));
  const list=$('#routeList'); list.innerHTML='';
  ROUTES.filter(r=>r.origin===id).forEach(r=>{
    const b=el('button',{class:'route-btn','aria-pressed':'false','data-r':r.id},`<span class="swatch" style="background:var(--route)"></span><span>${r.name}</span>`);
    b.onclick=()=>{pickRoute(r.id);scrollMain('learn');}; list.append(b);
  });
  pickRoute(ROUTES.find(r=>r.origin===id).id);
}
function pickRoute(id){
  curRoute=ROUTES.find(r=>r.id===id);
  $('#routeList').querySelectorAll('.route-btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===id));
  $('#learnMap').innerHTML=mapSVG(curRoute);
  $('#learnStops').innerHTML=curRoute.stops.map(s=>`<span class="stop">${s}</span>`).join('<span class="arrow">→</span>');
  $('#toWalk').hidden=!curRoute.walk;
}
$('#redraw').onclick=()=>{ $('#learnMap').innerHTML=mapSVG(curRoute); scrollMain('learn'); };
$('#toWalk').onclick=()=>{ switchTab('walk'); pickWalk(curRoute.walk); };

/* ---------- walk ---------- */
let W=null, idx=0, revealed=false;
WALKS.forEach(w=>{
  const b=el('button',{class:'chip','aria-pressed':'false','data-w':w.id},w.name);
  b.onclick=()=>{pickWalk(w.id);$('.viewer').scrollIntoView({block:'start'});}; $('#walkList').append(b);
});
function pickWalk(id){
  const w=WALKS.find(x=>x.id===id);
  W={...w, items: w.parts.flatMap(([k,label])=>DATA.photos[k].map(p=>({...p,label})))};
  idx=0;
  $('#walkList').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.w===id));
  $('#dots').innerHTML=W.items.map(()=>'<span class="dot"></span>').join('');
  showPhoto();
}
function showPhoto(){
  const it=W.items[idx]; const guess=$('#guess').checked;
  revealed=!guess;
  setImg($('#photoImg'), revealed ? it.ann : DATA.raw[it.id]); if(!revealed){ const pre=new Image(); pre.src=it.ann; }
  $('#photoImg').alt = `${W.name}，第 ${idx+1} 張`;
  $('#cover').hidden = revealed;
  $('#partName').textContent = it.label;
  $('#count').textContent = `${idx+1} / ${W.items.length}`;
  $('#prev').disabled = idx===0;
  $('#next').textContent = idx===W.items.length-1 ? '到了' : '下一張';
  $('#dots').querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<=idx));
}
function reveal(){ revealed=true; setImg($('#photoImg'), W.items[idx].ann); $('#cover').hidden=true; if(!$('#lb').hidden) syncLb(); }
$('#photo').onclick=()=>{ if(!revealed) reveal(); else openLb(); };
function syncLb(){ const it=W.items[idx]; setImg($('#lbImg'), revealed ? it.ann : DATA.raw[it.id]); $('#lbImg').alt=$('#photoImg').alt; $('#lbCount').textContent=`${idx+1} / ${W.items.length}`; $('#lbPrev').disabled=idx===0; }
function openLb(){ $('#lb').hidden=false; syncLb(); $('#lbClose').focus(); }
function closeLb(){ $('#lb').hidden=true; $('#zoom').focus({preventScroll:true}); }
$('#zoom').onclick=openLb; $('#lbClose').onclick=closeLb;
$('#lbImg').onclick=()=>{ if(!revealed) reveal(); };
$('#lbPrev').onclick=()=>{ $('#prev').click(); syncLb(); };
$('#lbNext').onclick=()=>{ $('#next').click(); syncLb(); };
document.addEventListener('keydown',e=>{ if($('#lb').hidden) return;
  if(e.key==='Escape') closeLb(); else if(e.key==='ArrowRight') $('#lbNext').click(); else if(e.key==='ArrowLeft') $('#lbPrev').click(); });
(function(){ let x0=null; const l=$('#lb');
  l.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  l.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>50){ dx<0?$('#lbNext').click():$('#lbPrev').click(); } });
})();
$('#prev').onclick=()=>{ if(idx>0){idx--;showPhoto();} };
$('#next').onclick=()=>{ if(idx<W.items.length-1){idx++;showPhoto();} else { const n=WALKS.findIndex(w=>w.id===W.id); pickWalk(WALKS[(n+1)%WALKS.length].id); } };
$('#guess').onchange=()=>{ store.set('guess',$('#guess').checked?'1':'0'); showPhoto(); };
(function swipe(){ let x0=null; const p=$('#photo');
  p.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  p.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>50){ dx<0?$('#next').click():$('#prev').click(); } });
})();

/* ---------- layout: move controls into sidebar on wide screens ---------- */
mq = matchMedia('(min-width:900px)');
function placeControls(){
  const side=$('#side');
  ['tabs','learnA','learnB','walkA'].forEach(id=>{
    const node=$('#'+id), ph=$('#ph-'+id);
    if(mq.matches){ side.append(node); } else { ph.after(node); }
  });
}
mq.addEventListener ? mq.addEventListener('change',placeControls) : mq.addListener(placeControls);
placeControls();

/* ---------- init ---------- */
$('#guess').checked = store.get('guess')==='1';
pickOrigin('miao');
pickWalk('W1');
switchTab(['learn','walk'].includes(store.get('tab'))?store.get('tab'):'learn');
</script>
</body>
</html>
